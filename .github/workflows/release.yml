# SAEngine release: builds the Windows x64 user setup with EnergyPlus, LibreCAD and LibreDWG bundled
# (all from pinned, SHA-256-checked downloads), smoke-tests it, keeps the setup, its .sha256 and the
# third-party sources zip as a run artefact, and for a release tag creates the GitHub pre-release
# as a DRAFT. It never publishes: a person reviews the draft and publishes it. Windows minutes
# cost twice Linux minutes, so it runs only on release tags and by hand. How: docs/release.md.
name: Release

on:
  push:
    tags: ['Pre-Alpha-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag Pre-Alpha-v<N>. Empty: a test build of the chosen branch (artefacts only, no release)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version in the file names (default: <x.y.z of the v<x.y.z> commit>-alpha.<N>; test build: <x.y.z>-ci.<run number>)'
        required: false
        type: string
      draft_release:
        description: 'With a tag: also create the draft pre-release (never published by the workflow)'
        required: false
        type: boolean
        default: false

# One release build per tag (or branch, for test builds) at a time; a second one waits instead
# of cancelling the first.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    # A larger runner (for example a 4-core Windows larger runner) can be set in the repository
    # variable SAENGINE_RELEASE_RUNNER; see docs/ci.md.
    runs-on: ${{ vars.SAENGINE_RELEASE_RUNNER || 'windows-latest' }}
    timeout-minutes: 300
    env:
      # A tag push releases its tag; a dispatch releases the tag input, or nothing when empty.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      CREATE_RELEASE: ${{ github.event_name == 'push' || (inputs.tag != '' && inputs.draft_release) }}
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the version comes from the release commit (v<x.y.z>) and the
          # build stamps the commit into product.json. third_party/opensees-studio is vendored.
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: |
            packages/fem-viewer/package-lock.json
            packages/cad-editor/package-lock.json

      - name: Set up Python (for the CI scripts and node-gyp)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Version and title
        id: release
        shell: pwsh
        run: python -I scripts/ci/release.py version --tag "$env:RELEASE_TAG" --version "${{ inputs.version }}"

      - name: Disk and memory
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          '{0:N1} GB RAM' -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)

      # --- Caches. GitHub scopes caches by ref: a run can restore what runs on its own branch or
      # tag and on the default branch saved. Test builds by hand on a branch therefore reuse each
      # other's caches; a tag push only finds what main saved (docs/release.md).

      # EnergyPlus, LibreCAD, LibreDWG, their licence texts (scripts/ci/third-party-binaries.json),
      # the copyleft source archives (scripts/installer/copyleft-sources.json) and the CPython of
      # bundle-python.ps1. Every file is checked against its pinned SHA-256 again after a restore.
      - name: Cache the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/third-party-cache
            ${{ runner.temp }}/librecad-licenses
            ${{ runner.temp }}/libredwg-licenses
            workbench/.build/saengine-installer/cache
          key: release-downloads-${{ hashFiles('scripts/ci/third-party-binaries.json', 'scripts/installer/copyleft-sources.json', 'scripts/installer/bundle-python.ps1') }}
          restore-keys: release-downloads-

      # pip's wheel cache for the bundled Python's backend packages (pinned by constraints.txt).
      - name: Cache the pip wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: release-pip-${{ hashFiles('scripts/installer/constraints.txt', 'python/pyproject.toml', 'third_party/opensees-studio/pyproject.toml') }}
          restore-keys: release-pip-

      # The Electron zip that the gulp packaging downloads (@electron/get's cache), keyed as
      # Code - OSS's own setup-electron action keys it.
      - name: Electron cache folder
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "ELECTRON_CACHE_PATH=$(Join-Path $env:LOCALAPPDATA 'electron\Cache')"

      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ELECTRON_CACHE_PATH }}
          key: release-electron-${{ env.VSCODE_ARCH }}-${{ hashFiles('workbench/.npmrc', 'workbench/build/checksums/electron.txt') }}

      - name: Fetch EnergyPlus 26.2.0, LibreCAD 2.2.1.6, LibreDWG 0.14 and the licence texts (SHA-256 pinned)
        id: thirdparty
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          python -I scripts/ci/fetch_pinned.py --cache "$env:RUNNER_TEMP/third-party-cache" --out "$env:RUNNER_TEMP/third-party" energyplus librecad libredwg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/ci/fetch_pinned.py --cache "$env:RUNNER_TEMP/librecad-licenses" librecad-license librecad-gpl-2.0 qt-lgpl-3.0 qt-gpl-3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I scripts/ci/fetch_pinned.py --cache "$env:RUNNER_TEMP/libredwg-licenses" libredwg-copying
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP/librecad-licenses", "$env:RUNNER_TEMP/libredwg-licenses" -Filter '*.partial' | Remove-Item -Force

      - name: Build the SAEngine viewer packages
        shell: pwsh
        working-directory: packages
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($package in 'fem-viewer', 'cad-editor') {
            Push-Location $package
            npm ci; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }

      # Code - OSS's own Windows node_modules cache: the key hashes every package.json and
      # package-lock.json of the workbench, its build folder and built-in extensions; the archive
      # is made with 7-Zip (workbench/.github/workflows/node_modules_cache/cache.ps1).
      - name: Compute the node_modules cache key
        shell: pwsh
        working-directory: workbench
        run: |
          $null = New-Item -ItemType Directory -Force .build
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts win32 $env:VSCODE_ARCH $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workbench/.build/node_modules_cache
          key: release-node-modules-win32-${{ hashFiles('workbench/.build/packagelockhash') }}

      - name: Extract node_modules
        if: steps.node-modules.outputs.cache-hit == 'true'
        shell: pwsh
        working-directory: workbench
        run: ./.github/workflows/node_modules_cache/cache.ps1 extract

      - name: npm ci (workbench)
        if: steps.node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: workbench
        timeout-minutes: 75
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build
          npm ci; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # As Code - OSS's Windows CI: the preinstall step first, so that native modules build
          # against the patched Electron headers.
          node build/npm/preinstall.ts; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Start-Sleep -Seconds 10
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # The @saengine/* packages are file:../packages/* junctions: kept out of the archive (it
      # would store a stale copy of the packages) and made again after an extract.
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: workbench
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath node_modules/@saengine -Recurse -Force -ErrorAction SilentlyContinue
          ./.github/workflows/node_modules_cache/cache.ps1 archive

      - name: Upload the node_modules cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workbench/.build/node_modules_cache
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Link the SAEngine viewer packages
        shell: pwsh
        working-directory: workbench
        run: |
          $ErrorActionPreference = 'Stop'
          $scope = 'node_modules/@saengine'
          Remove-Item -LiteralPath $scope -Recurse -Force -ErrorAction SilentlyContinue
          $null = New-Item -ItemType Directory -Force $scope
          foreach ($package in 'fem-viewer', 'cad-editor') {
            $null = New-Item -ItemType Junction -Path "$scope/$package" -Target (Resolve-Path "../packages/$package").Path
          }
          Get-ChildItem $scope | Format-Table Name, LinkType, Target

      # The built-in extensions the gulp build downloads (product.json builtInExtensions).
      - name: Built-in extensions cache key
        shell: pwsh
        working-directory: workbench
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Cache the built-in extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workbench/.build/builtInExtensions
          key: release-builtin-extensions-${{ hashFiles('workbench/.build/builtindepshash') }}

      - name: Build the installer (scripts/build-installer.ps1)
        shell: powershell
        timeout-minutes: 180
        run: |
          & scripts\build-installer.ps1 -Version '${{ steps.release.outputs.version }}' `
            -EnergyPlusDir '${{ steps.thirdparty.outputs.energyplus_dir }}' `
            -LibreCADDir '${{ steps.thirdparty.outputs.librecad_dir }}' `
            -LibreCADLicenseDir "$env:RUNNER_TEMP\librecad-licenses" `
            -LibreDWGDir '${{ steps.thirdparty.outputs.libredwg_dir }}' `
            -LibreDWGLicenseDir "$env:RUNNER_TEMP\libredwg-licenses" `
            -MinFreeGB 12

      # ---- SIGNING HOOK (not active) -----------------------------------------------------------
      # The setup is not code-signed yet. SignPath (free for open-source projects) is planned once
      # the repository is public: then build-installer.ps1's SAENGINE_SIGN_HOOK signs the app's
      # executables before Inno Setup and the setup after it (before its .sha256 is written), or
      # the SignPath GitHub action signs an uploaded artefact here. See docs/release.md.
      - name: Code signing (not yet)
        shell: pwsh
        run: Write-Host '::notice::The setup is not code-signed (SignPath once the repository is public; docs/release.md).'

      - name: Smoke test (silent install, bundled Python, app start, uninstall)
        shell: powershell
        timeout-minutes: 30
        run: |
          & scripts\installer\smoke-test.ps1 -Setup "dist\SAEngine-x64-user-setup-${{ steps.release.outputs.version }}.exe"

      - name: Verification Manual (with the bundled Python)
        shell: pwsh
        timeout-minutes: 45
        run: |
          # The pack exits 1 while a known issue fails; the expected-failure list decides.
          $PSNativeCommandUseErrorActionPreference = $false
          & VSCode-win32-x64\resources\python\python.exe -I -m saengine.verification --pdf --out "$env:RUNNER_TEMP\verification"
          python -I scripts/ci/check_verification.py "$env:RUNNER_TEMP\verification\verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect the release files
        id: assets
        shell: pwsh
        run: |
          python -I scripts/ci/release.py assets --tag "$env:RELEASE_TAG" --version '${{ steps.release.outputs.version }}' `
            --out "$env:RUNNER_TEMP\release\assets" --verification-pdf "$env:RUNNER_TEMP\verification\verification-manual.pdf"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the setup, its SHA-256 and the third-party sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAEngine-setup-${{ steps.release.outputs.version }}
          path: |
            ${{ runner.temp }}/release/assets/SAEngine-x64-user-setup-*.exe
            ${{ runner.temp }}/release/assets/SAEngine-x64-user-setup-*.exe.sha256
            ${{ runner.temp }}/release/assets/SAEngine-*-third-party-sources.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create the draft GitHub pre-release
        if: env.CREATE_RELEASE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release for $env:RELEASE_TAG exists already: delete it or use a new tag."
          }
          $global:LASTEXITCODE = 0
          # Always a draft: publishing (which also creates the tag of a dispatched run) is a
          # person's decision on GitHub, never this workflow's.
          $files = Get-ChildItem "$env:RUNNER_TEMP\release\assets" -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG --draft --prerelease --target '${{ github.sha }}' `
            --title '${{ steps.release.outputs.title }}' --notes-file '${{ steps.assets.outputs.notes }}' @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the build logs and notices
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-logs
          path: |
            VSCode-win32-x64/THIRD_PARTY_NOTICES.txt
            VSCode-win32-x64/resources/librecad/SAENGINE-BUNDLE.json
            VSCode-win32-x64/resources/libredwg/SAENGINE-BUNDLE.json
            dist/*-third-party-sources/README.txt
            ${{ runner.temp }}/SAEngine-smoke/setup.log
            ${{ runner.temp }}/release/release-notes.md
            ${{ runner.temp }}/verification/verification.json
          if-no-files-found: ignore
          retention-days: 14
