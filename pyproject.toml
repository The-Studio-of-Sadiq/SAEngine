[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saengine"
version = "0.1.0"
description = "Structure Analysis Engine — A modern, open-source structural analysis and design platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SAEngine Contributors"},
]
keywords = ["structural-engineering", "finite-element", "opensees", "etabs", "seismic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # GUI
    "PySide6>=6.6.0",
    # 3D Visualization
    "pyvista>=0.43.0",
    "pyvistaqt>=0.11.0",
    "vtk>=9.3.0",
    # Computational Engine
    "openseespy>=3.5.0",
    # Numerical
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    # Data Storage
    "h5py>=3.10.0",
    # CAD Import (future)
    "ezdxf>=0.19.0",
    # Reporting
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
saengine = "saengine.app:main"

[project.entry-points."saengine.design_codes"]
# Built-in design codes registered as entry points

[project.gui-scripts]
saengine-gui = "saengine.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
