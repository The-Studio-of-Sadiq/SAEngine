<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
	<title>SAEngine Project</title>
	<style>
		:root {
			color-scheme: dark;
			--panel: #151f2a;
			--border: rgba(151, 177, 197, .14);
			--text: #edf3f7;
			--muted: #91a1af;
			--teal: #54d7c6;
			--gold: #ffbf73;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			color: var(--text);
			background: radial-gradient(ellipse at 80% 0, rgba(53,211,191,.07), transparent 42%), #101720;
			font-family: var(--vscode-font-family, "Segoe UI", sans-serif);
		}
		.shell { width: min(1200px, 100%); margin: 0 auto; padding: 24px clamp(18px, 4vw, 48px); }
		header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
		header img { width: 38px; height: 38px; }
		.brand { font-size: 16px; font-weight: 680; }
		.product { margin-left: auto; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
		.workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
		.actions { display: flex; gap: 7px; margin-left: auto; }
		button { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); background: #1a2632; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
		button:hover { border-color: rgba(84,215,198,.5); background: #202f3c; }
		button.primary { border-color: var(--teal); color: #10211f; background: var(--teal); }
		.editor { min-height: 600px; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
		.editor-head { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 17px; border-bottom: 1px solid var(--border); }
		.editor-head strong { font-size: 12px; }
		.editor-head button { margin-left: auto; }
		.editor-body { min-height: 490px; padding: 22px; }
		.module-panel h2 { margin: 0 0 6px; font-size: 18px; font-weight: 620; }
		.module-panel p { color: var(--muted); font-size: 11px; line-height: 1.6; }
		.module-panel h3 { margin: 20px 0 9px; font-size: 12px; }
		.module-panel .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
		.module-panel label { display: grid; gap: 5px; min-width: 0; color: #aab8c3; font-size: 10px; }
		.module-panel label.wide { grid-column: 1 / -1; }
		.module-panel input, .module-panel select, .module-panel textarea { width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 5px; padding: 8px; color: var(--text); background: #101923; font: inherit; font-size: 11px; }
		.module-panel input[type=checkbox] { width: auto; }
		.module-panel textarea { min-height: 84px; resize: vertical; }
		.module-panel .check-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
		.module-panel .check-row label { display: flex; align-items: center; gap: 5px; }
		.module-panel .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
		.module-panel .notice { padding: 10px; border-left: 2px solid var(--gold); background: rgba(255,191,115,.07); }
		.module-panel .member-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; margin: 12px 0; }
		.module-panel .member-row { display: flex; justify-content: space-between; gap: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-size: 10px; }
		footer { margin-top: 18px; color: #71818f; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
		@media (max-width: 760px) { .editor { min-height: 480px; } }
	</style>
</head>
<body>
	<div class="shell">
		<header>
			<img src="media/saengine-mark.svg" alt="SAEngine structural-frame logo">
			<span class="brand">SAEngine</span>
			<span class="product">Project workspace</span>
		</header>
		<main class="workspace">
			<section class="editor" aria-label="Project module editor">
				<div class="editor-head">
					<strong id="view-title">CONSTRUCTION</strong>
					<div class="actions">
						<button class="primary" id="create-project">New project</button>
						<button id="open-project">Open project</button>
					</div>
					<span id="save-status">PROJECT DATA · ENGINEERING REVIEW REQUIRED</span>
					<button id="save-project" title="Save project changes">Save</button>
					<button id="open-module-file" title="Open the module's data file from its root folder">Open folder data</button>
					<button id="show-3d" title="Open the separate 3D viewer">3D Viewer</button>
				</div>
				<div class="editor-body">
					<div class="module-panel" id="module-panel" aria-live="polite"></div>
				</div>
			</section>
		</main>
		<footer>SAENGINE · Project folders and module data are stored at the project root.</footer>
	</div>
	<script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
