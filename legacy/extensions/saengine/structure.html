<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
	<title>SAEngine 3D Structure</title>
	<style>
		:root {
			color-scheme: dark;
			--muted: #91a1af;
			--border: rgba(151, 177, 197, .14);
		}
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body {
			color: #edf3f7;
			background: radial-gradient(ellipse at 50% 68%, rgba(52, 100, 114, .13), transparent 55%), #101923;
			font-family: var(--vscode-font-family, "Segoe UI", sans-serif);
		}
		.viewport { position: relative; width: 100%; height: 100%; min-height: 280px; }
		canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
		canvas:active { cursor: grabbing; }
		.toolbar {
			position: absolute;
			top: 10px;
			left: 10px;
			right: 10px;
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 7px 9px;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: rgba(13, 21, 30, .78);
			pointer-events: none;
		}
		#model-name { overflow: hidden; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
		#model-stats { margin-left: auto; color: var(--muted); font-size: 10px; white-space: nowrap; }
		#reset-view {
			padding: 4px 7px;
			border: 1px solid var(--border);
			border-radius: 4px;
			color: inherit;
			background: #1a2632;
			font: inherit;
			font-size: 10px;
			pointer-events: auto;
			cursor: pointer;
		}
		.hint {
			position: absolute;
			right: 12px;
			bottom: 10px;
			padding: 5px 8px;
			border: 1px solid var(--border);
			border-radius: 5px;
			color: #91a1af;
			background: rgba(13, 21, 30, .72);
			font-size: 9px;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<main class="viewport" aria-label="Interactive 3D structural model">
		<canvas id="structure-view" aria-label="Orbitable 3D frame model. Drag to orbit and scroll to zoom."></canvas>
		<div class="toolbar">
			<strong id="model-name">Loading model</strong>
			<span id="model-stats">Preparing model…</span>
			<button id="reset-view" title="Reset camera">Reset</button>
		</div>
		<div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
	</main>
	<script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
