[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saengine"
version = "0.1.0"
description = "SAEngine Python backend: JSON-RPC bridge between the SAEngine workbench and the opensees-studio headless core."
license = "AGPL-3.0-only"
requires-python = "==3.12.*"  # OpenSeesPy 3.8 Windows builds link python312.dll
dependencies = [
    # Headless core + services (no Qt). Installed from the pinned submodule, see README.
    "opensees-studio",
    "pygls>=2.1,<3",
    "sectionproperties>=3.10,<4",  # section constants of object profiles
    "ifcopenshell>=0.8,<1",  # IFC export of the building model (LGPL-3.0)
    "gmsh>=4.13,<5",  # meshing walls and slabs for the analysis model (GPL-2.0-or-later)
    "ezdxf>=1.3,<2",  # DXF import of structural geometry (MIT)
    "rhino3dm>=8.17,<9",  # Rhino (.3dm) import of structural geometry (MIT)
    "shapely>=2,<3",  # mid-surfaces of imported plates, quantities (BSD-3-Clause)
    "concreteproperties>=0.8,<0.9",  # RC section capacities for the design checks (MIT)
    "typst>=0.14,<0.15",  # PDF design report (Apache-2.0)
    "openpyxl>=3.1,<4",  # Excel import of borehole logs (MIT)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=5"]

[project.scripts]
saengine-rpc = "saengine.rpc.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"saengine.report" = ["templates/*.typ"]
"saengine.verification" = ["templates/*.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
