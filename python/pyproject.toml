[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saengine"
dynamic = ["version"]  # saengine.__version__: the SAEngine app release (workbench/package.json)
description = "SAEngine Python backend: JSON-RPC bridge between the SAEngine workbench and the opensees-studio headless core."
license = "AGPL-3.0-only"
requires-python = "==3.12.*"  # OpenSeesPy 3.8 Windows builds link python312.dll
dependencies = [
    # Headless core + services (no Qt). Installed from the pinned submodule, see README.
    "opensees-studio",
    "pygls>=2.1,<3",
    "sectionproperties>=3.10,<4",  # section constants of object profiles
    "ifcopenshell>=0.8,<1",  # IFC export of the building model (LGPL-3.0)
    "gmsh>=4.13,<5",  # meshing walls and slabs for the analysis model (GPL-2.0-or-later)
    "ezdxf>=1.3,<2",  # DXF import of structural geometry (MIT)
    "rhino3dm>=8.17,<9",  # Rhino (.3dm) import of structural geometry (MIT)
    "shapely>=2,<3",  # mid-surfaces of imported plates, quantities (BSD-3-Clause)
    "concreteproperties>=0.8,<0.9",  # RC section capacities for the design checks (MIT)
    "typst>=0.14,<0.15",  # PDF design report (Apache-2.0)
    "openpyxl>=3.1,<4",  # Excel import of borehole logs (MIT)
    "wntr>=1.5,<1.6",  # plumbing water-supply hydraulics, EPANET 2.2 inside (BSD-3-Clause; EPANET MIT)
    "fluids>=1.3,<1.4",  # duct and pipe friction factors for the HVAC air side (MIT)
    "dulwich>=1.2.17,<1.3",  # the project's version history in git (Apache-2.0; dual-licensed, used under Apache-2.0)
    "pyproj>=3.8,<3.9",  # site map coordinates: WGS 84, BTM (EPSG:9678), the project grid (MIT; PROJ inside)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=5"]

[project.scripts]
saengine-rpc = "saengine.rpc.server:main"
saengine = "saengine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "saengine.__version__" }

[tool.setuptools.package-data]
"saengine.report" = ["templates/*.typ"]
"saengine.verification" = ["templates/*.typ"]
"saengine.codes" = [
    "packs/*/pack.json",
    "packs/*/data/*.json",
    "packs/*/*.md",
    "packs/*/*.png",
    "packs/*/templates/*.json",
    "schemas/*.json",
]
"saengine.boq" = ["data/*.json"]
# Copied in by scripts/installer/bundle-python.ps1 from third_party/freecad-profiles.
"saengine.importers" = ["data/freecad-profiles.csv", "data/freecad-profiles.LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs of several minutes (Run All on the sample)"]

[tool.ruff]
line-length = 100
target-version = "py312"
